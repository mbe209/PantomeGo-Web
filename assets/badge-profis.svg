<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <filter id="profisShadow" x="-25%" y="-25%" width="150%" height="150%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#243B33" flood-opacity="0.12"/>
    </filter>
    <filter id="crownGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#FDB813" flood-opacity="0.35"/>
    </filter>

    <linearGradient id="profisBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F0F9FF"/>
      <stop offset="100%" stop-color="#E0F2FE"/>
    </linearGradient>

    <linearGradient id="goldCrown" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE169"/>
      <stop offset="50%" stop-color="#FDB813"/>
      <stop offset="100%" stop-color="#E29307"/>
    </linearGradient>

    <linearGradient id="skyBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>
  </defs>

  <!-- Outer Rounded Pillowy Badge -->
  <rect x="8" y="8" width="104" height="104" rx="32" fill="url(#profisBg)" 
        stroke="url(#skyBorder)" stroke-width="3" filter="url(#profisShadow)"/>
  
  <!-- Tactile Golden Crown Trophy with Jewel Accents -->
  <g filter="url(#crownGlow)">
    <path d="M34,55 L25,32 C24.5,30.5 26.5,29.5 27.5,30.5 L43,40 L58.5,23 C59.2,22 60.8,22 61.5,23 L77,40 L92.5,30.5 C93.5,29.5 95.5,30.5 95,32 L86,55 Z" 
          fill="url(#goldCrown)" stroke="#D97706" stroke-width="2" stroke-linejoin="round"/>
    
    <!-- Crown Jewels (Soft Pearls) -->
    <circle cx="26" cy="30" r="4.2" fill="#F43F5E"/>
    <circle cx="60" cy="22" r="5" fill="#38BDF8"/>
    <circle cx="94" cy="30" r="4.2" fill="#63BA97"/>

    <!-- Crown Base Ribbon -->
    <rect x="32" y="55" width="56" height="7" rx="3.5" fill="#D97706"/>
    <circle cx="46" cy="58.5" r="1.8" fill="#FFE169"/>
    <circle cx="60" cy="58.5" r="1.8" fill="#FFE169"/>
    <circle cx="74" cy="58.5" r="1.8" fill="#FFE169"/>
  </g>

  <!-- Age Pill Box -->
  <rect x="16" y="74" width="88" height="26" rx="13" fill="#243B33"/>
  <text x="60" y="87" text-anchor="middle" dominant-baseline="central" 
        font-family="-apple-system, BlinkMacSystemFont, 'Outfit', 'Plus Jakarta Sans', sans-serif" 
        font-weight="800" font-size="11" letter-spacing="0.5px" fill="#FFFFFF">9+ JAHRE</text>
</svg>
