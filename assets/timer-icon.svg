<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <linearGradient id="timerGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#63BA97"/>
      <stop offset="50%" stop-color="#F9A826"/>
      <stop offset="100%" stop-color="#EF4444"/>
    </linearGradient>
    <filter id="timerShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#243B33" flood-opacity="0.15"/>
    </filter>
  </defs>
  <!-- Background Disc -->
  <circle cx="60" cy="60" r="52" fill="#FFFFFF" filter="url(#timerShadow)"/>
  
  <!-- Outer Gauge Track -->
  <circle cx="60" cy="60" r="42" fill="none" stroke="#E2E8F0" stroke-width="8"/>
  
  <!-- Animated Progress Ring (e.g. 75% complete) -->
  <circle cx="60" cy="60" r="42" fill="none" stroke="url(#timerGrad)" stroke-width="8"
          stroke-dasharray="264" stroke-dashoffset="66" stroke-linecap="round"
          transform="rotate(-90 60 60)"/>
  
  <!-- Dial Center -->
  <circle cx="60" cy="60" r="5" fill="#243B33"/>
  
  <!-- Hands -->
  <line x1="60" y1="60" x2="60" y2="30" stroke="#243B33" stroke-width="4" stroke-linecap="round"/>
  <line x1="60" y1="60" x2="78" y2="60" stroke="#F9A826" stroke-width="3" stroke-linecap="round"/>
  
  <!-- Digital Seconds Number -->
  <text x="60" y="85" text-anchor="middle" font-family="'Outfit', sans-serif" font-weight="800" font-size="14" fill="#243B33">60s</text>

  <!-- Top Timer Knob -->
  <rect x="54" y="6" width="12" height="6" rx="2" fill="#243B33"/>
</svg>
