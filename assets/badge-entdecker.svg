      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#243B33" flood-opacity="0.12"/>
    </filter>
  </defs>
  <!-- Outer Rounded Badge -->
  <rect x="7" y="7" width="106" height="106" rx="30" fill="#FFF7ED" stroke="#F9A826" stroke-width="4.5" filter="url(#badgeShadow2)"/>
  
  <!-- Explorer Compass -->
  <circle cx="60" cy="44" r="23" fill="#FFFFFF" stroke="#F9A826" stroke-width="3.5"/>
  <polygon points="60,25 65,44 60,41 55,44" fill="#EF4444"/>
  <polygon points="60,63 65,44 60,47 55,44" fill="#38BDF8"/>
  <circle cx="60" cy="44" r="3.5" fill="#243B33"/>
  <line x1="60" y1="21" x2="60" y2="25" stroke="#F9A826" stroke-width="2.5"/>
  <line x1="60" y1="63" x2="60" y2="67" stroke="#F9A826" stroke-width="2.5"/>
  <line x1="37" y1="44" x2="41" y2="44" stroke="#F9A826" stroke-width="2.5"/>
  <line x1="79" y1="44" x2="83" y2="44" stroke="#F9A826" stroke-width="2.5"/>

  <!-- Symmetrical, Cleanly-Scaled Age Pill Box -->
