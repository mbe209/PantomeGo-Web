  <text x="60" y="88.5" text-anchor="middle" dominant-baseline="central" font-family="-apple-system, BlinkMacSystemFont, 'Outfit', 'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="11" letter-spacing="0.4px" fill="#FFFFFF">5–7 JAHRE</text>
