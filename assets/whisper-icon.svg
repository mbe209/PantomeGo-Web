<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <filter id="whisperShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#243B33" flood-opacity="0.12"/>
    </filter>
  </defs>
  <!-- Background Badge Circle -->
  <circle cx="60" cy="60" r="52" fill="#E8F5EE" filter="url(#whisperShadow)"/>
  
  <!-- Ear Graphic -->
  <path d="M48,36 C36,36 30,46 30,58 C30,72 38,82 48,86 C54,88.5 58,85 58,80 C58,76 54,74 52,72 C46,67 44,60 44,56 C44,48 48,46 52,46 C56,46 58,49 60,53" 
        fill="none" stroke="#243B33" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M46,54 C46,58 50,60 52,60" 
        fill="none" stroke="#63BA97" stroke-width="4" stroke-linecap="round"/>

  <!-- Whisper Speech Bubble -->
  <g transform="translate(56, 28)">
    <!-- Small Cloud/Bubble -->
    <path d="M12,4 C22,4 28,10 28,18 C28,24 23,29 16,30 L10,36 L12,29 C6,28 2,23 2,18 C2,10 6,4 12,4 Z" 
          fill="#F9A826" stroke="#FFFFFF" stroke-width="2" filter="url(#whisperShadow)"/>
    <!-- Secret Sound Waves / Sparkles inside -->
    <circle cx="9" cy="17" r="2" fill="#FFFFFF"/>
    <circle cx="15" cy="17" r="2" fill="#FFFFFF"/>
    <circle cx="21" cy="17" r="2" fill="#FFFFFF"/>
  </g>

  <!-- Stars / Magic Sparkles -->
  <path d="M78,16 L80,21 L85,23 L80,25 L78,30 L76,25 L71,23 L76,21 Z" fill="#FDB813"/>
  <path d="M88,48 L89.5,52 L93,53.5 L89.5,55 L88,58.5 L86.5,55 L83,53.5 L86.5,52 Z" fill="#63BA97"/>
  <path d="M26,30 L27,33 L30,34 L27,35 L26,38 L25,35 L22,34 L25,33 Z" fill="#F9A826"/>
</svg>
