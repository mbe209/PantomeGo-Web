<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <filter id="whisperSoftShadow" x="-25%" y="-25%" width="150%" height="150%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#243B33" flood-opacity="0.12"/>
    </filter>
    <filter id="bubbleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#F9A826" flood-opacity="0.25"/>
    </filter>

    <linearGradient id="whisperBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EBF7F1"/>
      <stop offset="100%" stop-color="#DDF0E6"/>
    </linearGradient>

    <linearGradient id="bubbleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFBD4A"/>
      <stop offset="100%" stop-color="#F59312"/>
    </linearGradient>

    <linearGradient id="mintAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#72D4AB"/>
      <stop offset="100%" stop-color="#4AA881"/>
    </linearGradient>
  </defs>

  <!-- Soft Tactile Squircle Container -->
  <rect x="10" y="10" width="100" height="100" rx="32" fill="url(#whisperBgGrad)" filter="url(#whisperSoftShadow)"/>

  <!-- Warm Friendly Ear Wave (Soft & Organic) -->
  <path d="M46,38 C35,38 28,47 28,58 C28,72 37,81 46,85 C51,87 55,84 55,79 C55,75 52,73 50,71 C44,66 42,60 42,56 C42,49 46,47 50,47 C53,47 55,49 57,53" 
        fill="none" stroke="#243B33" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M44,55 C44,59 48,61 50,61" 
        fill="none" stroke="url(#mintAccent)" stroke-width="4" stroke-linecap="round"/>

  <!-- Plump Pillowy Speech Bubble (Secret Whisper) -->
  <g transform="translate(52, 26)" filter="url(#bubbleGlow)">
    <path d="M16,4 C28,4 38,11 38,21 C38,28 32,34 23,36 L16,44 C15,45.5 13,44.5 13.5,43 L15,36.5 C7,35 2,29 2,21 C2,11 12,4 16,4 Z" 
          fill="url(#bubbleGrad)" stroke="#FFFFFF" stroke-width="2.5"/>
    <!-- Specular Highlight -->
    <ellipse cx="18" cy="12" rx="10" ry="4" fill="#FFFFFF" opacity="0.35"/>
    
    <!-- Secret Sound Dots -->
    <circle cx="12" cy="20" r="2.8" fill="#FFFFFF"/>
    <circle cx="19" cy="20" r="2.8" fill="#FFFFFF"/>
    <circle cx="26" cy="20" r="2.8" fill="#FFFFFF"/>
  </g>

  <!-- Friendly Magic Sparkles / Stars -->
  <g fill="#FDB813">
    <!-- Star 1 -->
    <path d="M84,18 C85,22 88,24 92,25 C88,26 85,28 84,32 C83,28 80,26 76,25 C80,24 83,22 84,18 Z"/>
    <!-- Star 2 -->
    <path d="M96,52 C97,55 99,56 102,57 C99,58 97,59 96,62 C95,59 93,58 90,57 C93,56 95,55 96,52 Z" fill="#63BA97"/>
    <!-- Tiny sparkle left -->
    <circle cx="24" cy="32" r="2.5" fill="#F9A826"/>
  </g>
</svg>
