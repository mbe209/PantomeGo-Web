<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80" width="80" height="80">
  <defs>
    <filter id="privShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#243B33" flood-opacity="0.12"/>
    </filter>
    <filter id="shieldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#63BA97" flood-opacity="0.3"/>
    </filter>
    <linearGradient id="privBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F2FAF6"/>
      <stop offset="100%" stop-color="#E2F4EC"/>
    </linearGradient>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#72D4AB"/>
      <stop offset="100%" stop-color="#4AA881"/>
    </linearGradient>
  </defs>
  <rect x="5" y="5" width="70" height="70" rx="22" fill="url(#privBg)" stroke="#63BA97" stroke-width="2.5" filter="url(#privShadow)"/>
  <!-- Friendly Shield with Checkmark -->
  <path d="M40,16 L57,23 C57,39 49,51 40,56 C31,51 23,39 23,23 Z" 
        fill="url(#shieldGrad)" stroke="#FFFFFF" stroke-width="2.5" filter="url(#shieldGlow)"/>
  <!-- Smooth Checkmark -->
  <path d="M33,36 L38,41 L47,29" fill="none" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
