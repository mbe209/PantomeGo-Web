<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <filter id="fanfareSoftShadow" x="-25%" y="-25%" width="150%" height="150%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#243B33" flood-opacity="0.14"/>
    </filter>
    <filter id="hornGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#F9A826" flood-opacity="0.3"/>
    </filter>

    <linearGradient id="fanfareBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF8E7"/>
      <stop offset="100%" stop-color="#FEF0C7"/>
    </linearGradient>

    <!-- Warm Golden Horn Gradients -->
    <linearGradient id="hornBodyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFC555"/>
      <stop offset="50%" stop-color="#F9A826"/>
      <stop offset="100%" stop-color="#E28612"/>
    </linearGradient>

    <linearGradient id="mintPopperGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#72D4AB"/>
      <stop offset="100%" stop-color="#4AA881"/>
    </linearGradient>
  </defs>

  <!-- Soft Tactile Squircle Container -->
  <rect x="10" y="10" width="100" height="100" rx="32" fill="url(#fanfareBgGrad)" filter="url(#fanfareSoftShadow)"/>

  <!-- Party Horn / Popper Body -->
  <!-- Base Cap (Mint) -->
  <path d="M22,90 C20,91 19,93 21,95 L27,101 C29,103 32,102 33,99 L42,88 L31,78 Z" 
        fill="url(#mintPopperGrad)"/>
  
  <!-- Horn Funnel with Soft Curves & Shading -->
  <g filter="url(#hornGlow)">
    <path d="M31,78 L78,44 C81,42 84,43 85,46 L90,57 C91,60 89,63 86,65 L42,88 Z" 
          fill="url(#hornBodyGrad)"/>
    <!-- Decorative Warm Stripes -->
    <path d="M47,67 L53,63 C54,62 56,63 57,65 L61,74 C62,76 61,78 59,79 L53,83 Z" fill="#FFE169"/>
    <path d="M63,55 L69,51 C70,50 72,51 73,53 L77,62 C78,64 77,66 75,67 L69,71 Z" fill="#F43F5E"/>
    <!-- Horn Bell Rim Opening -->
    <ellipse cx="86" cy="54" rx="8" ry="14" fill="#FFC555" transform="rotate(-35 86 54)"/>
    <ellipse cx="86" cy="54" rx="5" ry="10" fill="#243B33" transform="rotate(-35 86 54)"/>
  </g>

  <!-- Bursting Colorful Streamers & Confetti -->
  <!-- Curving Streamers with Round Caps -->
  <path d="M88,40 C96,28 92,18 100,12" fill="none" stroke="#F43F5E" stroke-width="3.5" stroke-linecap="round"/>
  <path d="M96,48 C108,44 105,32 114,26" fill="none" stroke="#63BA97" stroke-width="3.5" stroke-linecap="round"/>
  <path d="M84,68 C96,76 104,68 112,72" fill="none" stroke="#38BDF8" stroke-width="3.5" stroke-linecap="round"/>

  <!-- Plump Confetti Dots & Stars -->
  <circle cx="88" cy="24" r="3.5" fill="#F9A826"/>
  <circle cx="106" cy="46" r="3.2" fill="#8B5CF6"/>
  <circle cx="98" cy="80" r="4" fill="#FDB813"/>
  <circle cx="76" cy="18" r="2.8" fill="#63BA97"/>

  <!-- Soft Gold Stars -->
  <path d="M72,28 C73,31 75,32 78,33 C75,34 73,35 72,38 C71,35 69,34 66,33 C69,32 71,31 72,28 Z" fill="#FDB813"/>
  <path d="M106,62 C107,64 109,65 111,66 C109,67 107,68 106,70 C105,68 103,67 101,66 C103,65 105,64 106,62 Z" fill="#F43F5E"/>
</svg>
