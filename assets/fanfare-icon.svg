  <path d="M84,40 Q94,30 90,20 Q86,10 96,6" fill="none" stroke="#EF4444" stroke-width="3" stroke-linecap="round"/>
  <!-- Streamer Mint -->
  <path d="M92,50 Q106,46 104,36 Q102,26 112,22" fill="none" stroke="#63BA97" stroke-width="3" stroke-linecap="round"/>
  <!-- Streamer Sky Blue -->
