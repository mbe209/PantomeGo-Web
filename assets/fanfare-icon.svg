<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <filter id="fanfareShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#243B33" flood-opacity="0.12"/>
    </filter>
  </defs>
  <!-- Background Disc -->
  <circle cx="60" cy="60" r="52" fill="#FEF3C7" filter="url(#fanfareShadow)"/>
  
  <!-- Party Horn / Popper Body -->
  <path d="M22,88 L34,80 L44,90 L32,98 Z" fill="#63BA97"/>
  <path d="M34,80 L76,46 L86,60 L44,90 Z" fill="#F9A826"/>
