  <path d="M46,70 L52,65 L60,77 L54,82 Z" fill="#FDB813"/>
  <path d="M60,59 L66,54 L74,66 L68,71 Z" fill="#EF4444"/>
  <!-- Horn Bell Opening -->
  <ellipse cx="81" cy="53" rx="8" ry="14" fill="#FDB813" transform="rotate(-40 81 53)"/>
  <ellipse cx="81" cy="53" rx="5" ry="10" fill="#243B33" transform="rotate(-40 81 53)"/>

  <!-- Confetti Streamers & Stars -->
