<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <radialGradient id="rouletteGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#243B33" flood-opacity="0.15"/>
    </filter>
  </defs>
  <!-- Outer Wheel Rim -->
  <circle cx="60" cy="60" r="54" fill="#243B33" filter="url(#shadow)"/>
  <circle cx="60" cy="60" r="50" fill="#FFFFFF"/>
  
  <!-- Colored Wheel Segments -->
  <!-- Segment 1: Mint -->
  <path d="M60,60 L60,14 A46,46 0 0,1 92.5,27.5 Z" fill="#63BA97"/>
  <!-- Segment 2: Sunburst Orange -->
  <path d="M60,60 L92.5,27.5 A46,46 0 0,1 106,60 Z" fill="#F9A826"/>
  <!-- Segment 3: Honey Yellow -->
  <path d="M60,60 L106,60 A46,46 0 0,1 92.5,92.5 Z" fill="#FDB813"/>
  <!-- Segment 4: Sky Blue -->
  <path d="M60,60 L92.5,92.5 A46,46 0 0,1 60,106 Z" fill="#38BDF8"/>
  <!-- Segment 5: Purple Lavender -->
  <path d="M60,60 L60,106 A46,46 0 0,1 27.5,92.5 Z" fill="#A78BFA"/>
  <!-- Segment 6: Mint Dark -->
  <path d="M60,60 L27.5,92.5 A46,46 0 0,1 14,60 Z" fill="#4E9A7B"/>
  <!-- Segment 7: Coral Pink -->
  <path d="M60,60 L14,60 A46,46 0 0,1 27.5,27.5 Z" fill="#FB7185"/>
  <!-- Segment 8: Lemon Yellow -->
  <path d="M60,60 L27.5,27.5 A46,46 0 0,1 60,14 Z" fill="#FDE047"/>

  <!-- Inner Hub -->
  <circle cx="60" cy="60" r="18" fill="#FFFFFF" filter="url(#shadow)"/>
  <circle cx="60" cy="60" r="14" fill="#F9A826"/>
  <circle cx="60" cy="60" r="8" fill="#FDB813"/>
  <circle cx="60" cy="60" r="5" fill="#FFFFFF"/>

  <!-- Pointer Indicator (Top Arrow) -->
  <polygon points="60,6 50,22 70,22" fill="#E11D48" stroke="#FFFFFF" stroke-width="2" filter="url(#shadow)"/>
</svg>
