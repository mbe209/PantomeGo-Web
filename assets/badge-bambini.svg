<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <filter id="badgeShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#243B33" flood-opacity="0.12"/>
    </filter>
  </defs>
  <!-- Outer Rounded Badge -->
  <rect x="7" y="7" width="106" height="106" rx="30" fill="#E8F5EE" stroke="#63BA97" stroke-width="4.5" filter="url(#badgeShadow)"/>
  
  <!-- Cute Animal Pawprint -->
  <ellipse cx="60" cy="46" rx="19" ry="14" fill="#63BA97"/>
  <circle cx="40" cy="27" r="6.5" fill="#63BA97"/>
  <circle cx="53" cy="18" r="7" fill="#63BA97"/>
  <circle cx="67" cy="18" r="7" fill="#63BA97"/>
  <circle cx="80" cy="27" r="6.5" fill="#63BA97"/>

  <!-- Symmetrical, Cleanly-Scaled Age Pill Box -->
  <rect x="18" y="76" width="84" height="25" rx="12.5" fill="#243B33"/>
  <text x="60" y="88.5" text-anchor="middle" dominant-baseline="central" font-family="-apple-system, BlinkMacSystemFont, 'Outfit', 'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="11" letter-spacing="0.4px" fill="#FFFFFF">3–5 JAHRE</text>
</svg>
