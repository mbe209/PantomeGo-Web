<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <filter id="bambiniShadow" x="-25%" y="-25%" width="150%" height="150%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#243B33" flood-opacity="0.12"/>
    </filter>
    <filter id="pawGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#63BA97" flood-opacity="0.3"/>
    </filter>

    <linearGradient id="bambiniBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F2FAF6"/>
      <stop offset="100%" stop-color="#E2F4EC"/>
    </linearGradient>

    <linearGradient id="pawGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#76DCB2"/>
      <stop offset="100%" stop-color="#4AA881"/>
    </linearGradient>
  </defs>

  <!-- Outer Rounded Pillowy Badge -->
  <rect x="8" y="8" width="104" height="104" rx="32" fill="url(#bambiniBg)" 
        stroke="#63BA97" stroke-width="3" filter="url(#bambiniShadow)"/>
  
  <!-- Cute Soft Pawprint with Inner Glow & Specular -->
  <g filter="url(#pawGlow)">
    <!-- Main Pad -->
    <ellipse cx="60" cy="46" rx="20" ry="15" fill="url(#pawGrad)"/>
    <ellipse cx="58" cy="42" rx="12" ry="6" fill="#FFFFFF" opacity="0.25"/>
    
    <!-- Toe Pads -->
    <circle cx="39" cy="27" r="7" fill="url(#pawGrad)"/>
    <circle cx="53" cy="18" r="7.5" fill="url(#pawGrad)"/>
    <circle cx="67" cy="18" r="7.5" fill="url(#pawGrad)"/>
    <circle cx="81" cy="27" r="7" fill="url(#pawGrad)"/>
  </g>

  <!-- Age Pill Box with Rounded Corners -->
  <rect x="16" y="74" width="88" height="26" rx="13" fill="#243B33"/>
  <text x="60" y="87" text-anchor="middle" dominant-baseline="central" 
        font-family="-apple-system, BlinkMacSystemFont, 'Outfit', 'Plus Jakarta Sans', sans-serif" 
        font-weight="800" font-size="11" letter-spacing="0.5px" fill="#FFFFFF">3–5 JAHRE</text>
</svg>
